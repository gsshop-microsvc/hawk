buildscript {
  ext.kotlinVersion = '2.2.0'
  repositories {
    google()
    jcenter()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.10.1'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

// 16KB Conceal을 로컬 Maven repo에 배포 (AAR 빌드 시 files() 의존 불가 대응)
def concealRepoDir = file("${rootProject.projectDir}/repo/com/facebook/conceal/conceal/1.1.3-16kb")
concealRepoDir.mkdirs()
def concealPom = new File(concealRepoDir, 'conceal-1.1.3-16kb.pom')
if (!concealPom.exists()) {
  concealPom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project>
  <modelVersion>4.0.0</modelVersion>
  <groupId>com.facebook.conceal</groupId>
  <artifactId>conceal</artifactId>
  <version>1.1.3-16kb</version>
  <packaging>aar</packaging>
</project>
"""
}
def concealAar = new File(concealRepoDir, 'conceal-1.1.3-16kb.aar')
if (!concealAar.exists()) {
  concealAar.bytes = file("${rootProject.projectDir}/hawk/libs/conceal-1.1.3-16kb.aar").bytes
}

allprojects {
  repositories {
    google()
    jcenter()
    maven { url = uri(rootProject.file('repo')) }
  }
}

subprojects { project ->
  group = GROUP
  version = VERSION_NAME

  apply plugin: 'checkstyle'

  task checkstyle(type: Checkstyle) {
    configFile rootProject.file('checkstyle.xml')
    source 'src/main/java'
    ignoreFailures false
    showViolations true
    include '**/*.java'

    classpath = files()
  }

  afterEvaluate {
    if (project.tasks.findByName('check')) {
      check.dependsOn('checkstyle')
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}

ext {
  minSdkVersion = 15
  targetSdkVersion = 27
  compileSdkVersion = 27
  sourceCompatibilityVersion = JavaVersion.VERSION_1_7
  targetCompatibilityVersion = JavaVersion.VERSION_1_7
}

ext.deps = [
    gson          : 'com.google.code.gson:gson:2.8.2',
    conceal       : 'com.facebook.conceal:conceal:1.1.3-16kb',

    // Test dependencies
    junit         : 'junit:junit:4.12',
    truth         : 'com.google.truth:truth:0.28',
    robolectric   : 'org.robolectric:robolectric:3.3',
    mockito       : 'org.mockito:mockito-core:2.8.9',
    espressoRunner: 'com.android.support.test:runner:0.5',
    espressoRules : 'com.android.support.test:rules:0.5',
    kotlin        : "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"

]
