/**
 * Conceal 1.1.3-16kb AAR를 Maven(GitHub Packages 등)에 배포하는 스크립트.
 *
 * 사용법:
 *   1. gradle.properties 또는 환경변수로 저장소 URL·인증 설정
 *   2. ./gradlew publishConcealToGitHubPackages
 *
 * GitHub Packages 예시:
 *   gpr.repo=OWNER/REPO  (예: gsshop-microsvc/conceal-16kb)
 *   gpr.token=ghp_xxxx   (GitHub Personal Access Token, write:packages 권한)
 */
apply plugin: 'maven-publish'

def concealAar = rootProject.file("hawk/libs/conceal-1.1.3-16kb.aar")
if (!concealAar.exists()) {
  throw new GradleException("Conceal AAR not found: ${concealAar}")
}

def gprRepo = project.findProperty("gpr.repo") ?: System.getenv("GPR_REPO")
def gprUser = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
def gprToken = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")

publishing {
  publications {
    conceal(MavenPublication) {
      groupId = 'com.facebook.conceal'
      artifactId = 'conceal'
      version = '1.1.3-16kb'
      artifact(concealAar) {
        extension = 'aar'
      }
      pom {
        name = 'Conceal'
        description = 'Conceal 1.1.3 with 16KB page size aligned native libraries (Android 15+)'
        url = 'https://github.com/facebookarchive/conceal'
        licenses {
          license {
            name = 'BSD License'
            url = 'https://github.com/facebookarchive/conceal/blob/master/LICENSE'
          }
        }
      }
    }
  }
  repositories {
    if (gprRepo != null && gprToken != null) {
      maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/${gprRepo}")
        credentials {
          username = gprUser ?: "token"
          password = gprToken
        }
      }
    }
  }
}

tasks.register("publishConcealToGitHubPackages", PublishToMavenRepository) {
  group = "publishing"
  description = "Publishes conceal:1.1.3-16kb to GitHub Packages"
  publication = publishing.publications.conceal
  repository = publishing.repositories.findByName("GitHubPackages")
  onlyIf {
    if (repository == null) {
      logger.warn("GitHub Packages not configured. Set gpr.repo and gpr.token (or GPR_REPO, GITHUB_TOKEN).")
      return false
    }
    return true
  }
}
