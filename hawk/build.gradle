apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  compileSdkVersion rootProject.ext.compileSdkVersion

  namespace 'com.orhanobut.hawk'

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    consumerProguardFiles 'proguard-rules.pro'
    testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
  }

  lintOptions {
    textReport true
    textOutput 'stdout'
  }
}

dependencies {
  // compileOnly → JitPack 배포 시 POM에 안 넣음. 앱에서 AAR 직접 넣으면 됨 (단순 방식)
  compileOnly deps.conceal
  implementation deps.gson

  testImplementation deps.conceal
  androidTestImplementation deps.conceal

  testImplementation deps.junit
  testImplementation deps.truth
  testImplementation deps.robolectric
  testImplementation deps.mockito
  testImplementation deps.kotlin

  androidTestImplementation deps.junit
  androidTestImplementation deps.truth
  androidTestImplementation deps.espressoRunner
  androidTestImplementation deps.espressoRules
  androidTestImplementation deps.kotlin

}

//apply from: rootProject.file('gradle/maven_push.gradle')
